name: Build health scope trends

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/scripts/build_health_scope_trends.py"
      - ".github/workflows/build-health-scope-trends.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pandas numpy scipy statsmodels
      - run: python .github/scripts/build_health_scope_trends.py
      - name: Commit generated scope analyses
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v3/assets/scope-trends-data.js v3/data/health_metadata.json
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "Add national and regional health trend analyses"
            git push origin HEAD:main
          fi
