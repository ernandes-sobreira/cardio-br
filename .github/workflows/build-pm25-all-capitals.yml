name: Build PM2.5 all capitals

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/scripts/build_pm25_all_capitals.py"
      - ".github/workflows/build-pm25-all-capitals.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install analysis dependencies
        run: python -m pip install --upgrade pip pandas numpy scipy statsmodels duckdb
      - name: Download, verify and build national PM2.5 dataset
        run: python .github/scripts/build_pm25_all_capitals.py
      - name: Commit generated datasets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v3/data/pm25_capitais_diario_2008_2024.csv
          git add v3/data/pm25_capitais_anual_2008_2024.csv
          git add v3/data/pm25_capitais_metadata.json
          git add v3/assets/pm25-capitais-data.js
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "Add national PM2.5 data for all 27 capitals"
            git push origin HEAD:main
          fi
